snowflake_customer_sentiment:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'test') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'CUSTOMER_FEEDBACK_DB') }}"
      schema: RAW
      threads: 4
      client_session_keep_alive: False
      query_tag: dbt_customer_sentiment
